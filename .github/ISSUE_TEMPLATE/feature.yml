name: Product slice
description: Propose one reviewable learner-facing product change.
title: "[Slice]: "
labels: [product]
body:
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options: [Atlas, Practice, Studio, You, People (gated), Platform]
    validations:
      required: true
  - type: textarea
    id: learner_problem
    attributes:
      label: Learner problem
      description: Describe observable friction, not a feature wish.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and source
      description: Link the research artifact, user evidence or instrument that supports this work.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Learning and state contract
      description: Name curriculum IDs, evidence target, support trace and affected state domains.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity gates
      options:
        - label: This does not infer skill from habit or credits.
          required: true
        - label: This does not fabricate AI, tutor or community activity.
          required: true
        - label: Required language, safety, privacy and assessment reviews are named.
          required: true
