name: web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run preview:web
      - uses: actions/upload-artifact@v4
        with:
          name: living-language-atlas-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
